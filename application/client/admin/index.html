<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="/logo.png" />

    <title>Admin Control Panel - Dealzy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {

              primary: {

                hover: '#1e293b',
              },
              secondary: '#64748b',
              accent: '#0f172a',
            },
            borderRadius: {

              '2xl': '20px',

      }
